services:
  fivem:
    image: ghcr.io/skriptzip/fivem-enhanced:latest
    container_name: fivem-server
    restart: unless-stopped
    stop_grace_period: 46s
    ports:
      - "127.0.0.1:30120:30120/tcp"
      - "127.0.0.1:30120:30120/udp"
    volumes:
      - ./fivem-data:/fivem-data
    environment:
      - LICENSE_KEY=${LICENSE_KEY}
      - SERVER_NAME=${SERVER_NAME:-FiveM Enhanced Server}
      - SERVER_DESC=${SERVER_DESC:-A FiveM Enhanced Server running in Docker}
      - SERVER_TAGS=${SERVER_TAGS:-default}
      - MAX_CLIENTS=${MAX_CLIENTS:-32}
      - LOCALE=${LOCALE:-en-US}
      - RCON_PASSWORD=${RCON_PASSWORD:-changeme}
      - STEAM_API_KEY=${STEAM_API_KEY:-none}
      - WHITELIST=${WHITELIST:-0}
      - PURE_LEVEL=${PURE_LEVEL:-0}
      - LOG_BANS=${LOG_BANS:-1}
      - LOG_HEARTBEATS=${LOG_HEARTBEATS:-1}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
      - /server/.fxs_home:size=16M
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
